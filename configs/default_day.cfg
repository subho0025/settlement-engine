# A normal business day in a large-value payment system.
# Amounts are plain units, times are plain time units (think seconds), banks are ids 0..banks-1.
# Any key left out keeps its built-in default; run `gen_day --print-config` to see them all.

seed = 2026

# 100 banks; a few big ones send and receive most payments (bank i has weight 1/(i+1))
banks = 100
concentration = 1

# 50,000 payments over a day of 36,000 time units (10 hours of seconds)
payments = 50000
length = 36000

# sizes from 2,000 to 5,000,000; each x10 band is 40% as common as the one below;
# 30% of amounts are round figures (two significant digits)
amount_min = 2000
amount_max = 5000000
decade_permille = 400
round_permille = 300

# when payments arrive, per tenth of the day: ordinary ones peak mid-morning and late afternoon,
# large ones (100,000 and up) build up towards the close
large_threshold = 100000
volume_profile = 5,10,12,10,7,8,10,12,9,6
value_profile = 2,4,6,8,7,9,12,15,17,14

# 20% of payments must settle within 900 to 7200 time units of arriving
deadline_permille = 200
deadline_min = 900
deadline_max = 7200

# 30% of payments are answered by a similar payment back within 1800 time units
reciprocal_permille = 300
reciprocal_lag = 1800

# each bank starts with 5% of what it will send during the day, and no intraday credit
liquidity_permille = 50
credit_permille = 0